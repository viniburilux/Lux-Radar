name: Lux Radar weekly release

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lux-radar-pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build daily release
        run: python scripts/build_release.py --release-id weekly-${{ github.run_id }}

      - name: Validate published data
        run: python tests/validate_fixtures.py

      - name: Commit published data
        run: |
          git config user.name "lux-radar-bot"
          git config user.email "lux-radar-bot@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "No published data changes."
          else
            git commit -m "data: publish daily opportunity release"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
